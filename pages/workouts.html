<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workouts - Fitness</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/pages/workouts.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1>Workouts</h1>

    <!-- Top stats & actions -->
    <section class="workouts-top">
      <div class="stats-bar">
        <div class="stat card"><strong id="stat-total">0</strong><div class="small muted">Total workouts</div></div>
        <div class="stat card"><strong id="stat-fav">0</strong><div class="small muted">Favorites</div></div>
        <div class="stat card"><strong id="stat-week">0</strong><div class="small muted">This week</div></div>
        <div class="stat card"><strong id="stat-streak">0</strong><div class="small muted">Streak (days)</div></div>
      </div>
      <div class="top-actions">
        <input id="workout-search" placeholder="Search workouts, muscles, tags" class="search-input" />
        <select id="sort-by" class="search-input" style="width:160px">
          <option value="">Sort</option>
          <option value="shortest">Shortest</option>
          <option value="longest">Longest</option>
          <option value="beginner">Beginner first</option>
        </select>
        <input id="calories-max" placeholder="Max calories" class="search-input" style="width:120px" />
        <a id="get-started" class="btn">Get Started</a>
        <a class="btn ghost" href="/pages/favorites.html">Favorites</a>
      </div>
    </section>

    <!-- Filters -->
    <section class="filters-row reveal">
      <div class="filters">
        <div class="filter-group">
          <div class="small muted">Difficulty</div>
          <button class="chip" data-filter="All" data-type="difficulty">All</button>
          <button class="chip" data-filter="Beginner" data-type="difficulty">Beginner</button>
          <button class="chip" data-filter="Intermediate" data-type="difficulty">Intermediate</button>
          <button class="chip" data-filter="Advanced" data-type="difficulty">Advanced</button>
        </div>
        <div class="filter-group">
          <div class="small muted">Duration</div>
          <button class="chip" data-filter="10-20" data-type="duration">10–20</button>
          <button class="chip" data-filter="20-40" data-type="duration">20–40</button>
          <button class="chip" data-filter="40+" data-type="duration">40+</button>
        </div>
        <div class="filter-group">
          <div class="small muted">Equipment</div>
          <button class="chip" data-filter="All" data-type="equipment">All</button>
          <button class="chip" data-filter="None" data-type="equipment">Bodyweight</button>
          <button class="chip" data-filter="Dumbbell" data-type="equipment">Dumbbell</button>
          <button class="chip" data-filter="Mat" data-type="equipment">Mat</button>
        </div>
      </div>
    </section>

    <!-- Workout list -->
    <section class="workout-list" aria-live="polite">
      <!-- cards generated by workouts.js -->
    </section>

    <!-- Empty state -->
    <section class="empty-state" style="display:none;margin-top:18px;text-align:center">
      <img src="../assets/images/empty-workouts.svg" alt="No results" style="width:240px;margin-bottom:12px" />
      <h4>No workouts found</h4>
      <p class="muted">Try clearing filters or change search</p>
      <button class="btn" id="reset-filters">Reset filters</button>
    </section>

    <!-- Weekly plan (mobile-friendly panel) -->
    <section class="weekly-panel reveal" style="margin-top:18px">
      <h3>Your Week</h3>
      <div class="weekly-plan card" style="padding:12px">
        <!-- populated by renderWeeklyPlan() -->
      </div>
    </section>

    <section class="cta" style="margin-top:18px">
      <p class="muted">New to fitness? Start with beginner programs and build consistency.</p>
      <a id="cta-get-started" class="btn">Get Started</a>
    </section>

    <!-- mobile plan FAB -->
    <button id="mobile-plan-btn" class="btn" style="display:none;position:fixed;right:18px;bottom:18px;border-radius:999px;width:56px;height:56px">Plan</button>

    <!-- Plan modal -->
    <div id="plan-modal" class="modal" aria-hidden="true">
      <div class="dialog">
        <button class="close" aria-label="Close">✕</button>
        <h3>Add to weekly plan</h3>
        <div class="form-row">
          <label>Day<select id="plan-day"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select></label>
          <label>Time<select id="plan-time"><option>Morning</option><option>Evening</option></select></label>
        </div>
        <div style="margin-top:12px"><button class="btn" id="plan-confirm">Add to plan</button> <button class="btn ghost" id="plan-cancel">Cancel</button></div>
      </div>
    </div>
    <section class="featured-workouts">


  <!-- WORKOUT CARDS -->
  <div class="workout-list" id="workoutList"></div>
</section>


      <!-- <div style="margin-top:12px"><a class="btn ghost" href="pages/workouts.html">View all workouts</a></div> -->
    </section>

    <!-- Toast -->
    <div id="toast" class="toast" aria-hidden="true"></div>

  </main>

  <script src="../js/header.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/workouts.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // workouts are public; dynamic list rendering is handled in workouts.js
      (function() {
  const workoutButtons = document.querySelectorAll('#workout-list .detail-btn');
  const filterChips = document.querySelectorAll('.filters-row .chip');

  // Sab buttons ke liye data attributes add karo dynamically
  const workoutData = {
    'hiit-1': {difficulty:'Beginner', duration: '20-40', equipment:'None'},
    'cardio-1': {difficulty:'Intermediate', duration:'40+', equipment:'None'},
    'strength-1': {difficulty:'Intermediate', duration:'20-40', equipment:'Dumbbell'},
    'strength-2': {difficulty:'Advanced', duration:'40+', equipment:'Dumbbell'},
    'yoga-1': {difficulty:'Beginner', duration:'20-40', equipment:'Mat'},
    'flexibility-1': {difficulty:'Beginner/Intermediate', duration:'40+', equipment:'Mat'},
    'balance-1': {difficulty:'Beginner/Intermediate', duration:'40+', equipment:'Mat'},
    'functional-1': {difficulty:'Beginner/Intermediate', duration:'40+', equipment:'None'},
    'hiit-2': {difficulty:'Advanced', duration:'40+', equipment:'None'},
    'mindbody-1': {difficulty:'Beginner/Intermediate', duration:'20-40', equipment:'Mat'}
  };

  // Click event for filter chips
  filterChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const type = chip.dataset.type;
      const filter = chip.dataset.filter;

      workoutButtons.forEach(btn => {
        const id = btn.dataset.workout;
        const data = workoutData[id];

        if(!data) return;

        // Default: show
        let show = true;

        if(type === 'difficulty' && filter !== 'All') {
          // Handle combined difficulty like Beginner/Intermediate
          if(data.difficulty.includes('/') && data.difficulty.includes(filter)) {
            show = true;
          } else if(data.difficulty !== filter) {
            show = false;
          }
        }

        if(type === 'duration' && filter !== 'All') {
          if(filter === '10-20' && !(parseInt(data.duration.split('-')[0]) >=10 && parseInt(data.duration.split('-')[0]) <=20)) show = false;
          if(filter === '20-40' && !(parseInt(data.duration.split('-')[0]) >=20 && parseInt(data.duration.split('-')[0]) <=40)) show = false;
          if(filter === '40+' && !(parseInt(data.duration.split('-')[0]) >=40)) show = false;
        }

        if(type === 'equipment' && filter !== 'All') {
          if(data.equipment !== filter) show = false;
        }

        btn.style.display = show ? 'block' : 'none';
      });
    });
  });
})();

    });
  </script>
  <script src="features.js"></script>
</body>
</html>
