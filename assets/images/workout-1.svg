<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#082032" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect rx="20" width="100%" height="100%" fill="#fff"/>
  <g transform="translate(30,30)" filter="url(#f1)">
    <rect x="0" y="0" width="540" height="340" rx="18" fill="url(#g1)" opacity="0.08"/>
  </g>

  <!-- stylized athlete -->
  <g transform="translate(80,60)">
    <circle cx="80" cy="40" r="28" fill="#fff" stroke="#eee" stroke-width="2"/>
    <rect x="60" y="80" rx="12" width="40" height="110" fill="#7c3aed"/>
    <path d="M20 100 q60 -40 120 0" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 140 q40 10 60 40" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g transform="translate(300,100)">
    <rect x="0" y="0" width="240" height="160" rx="12" fill="#fff"/>
    <text x="18" y="36" font-family="Poppins,Inter,Arial" font-weight="700" font-size="20" fill="#082032">Morning HIIT</text>
    <text x="18" y="64" font-family="Inter,Arial" font-size="13" fill="#5b6b75">20 mins • Beginner • Full body</text>
    <g transform="translate(18,90)">
      <rect x="0" y="0" width="76" height="34" rx="18" fill="url(#g1)" />
      <text x="18" y="22" font-family="Inter" font-size="13" fill="#fff">Start</text>
    </g>
  </g>
</svg>