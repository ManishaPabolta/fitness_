<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup - Fitness</title>
  <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/signup.css" /></head>
<body>
  <div id="site-header"></div>

  <main class="container auth-page">
    <h2>Signup</h2>
    <form id="signup-form" novalidate>
      <label>Full name
        <input type="text" id="name" required minlength="3" placeholder="Your full name" />
      </label>

      <label>Email
        <input type="email" id="email" required placeholder="you@example.com" />
      </label>

      <label>Password
        <div class="pw-field">
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
      </label>

      <label class="small muted">By signing up you agree to our <a href="/pages/about.html">terms</a>.</label>
      <button class="btn" type="submit">Create account</button>
      <p>Already have an account? <a href="login.html">Login</a></p>
      <p id="signup-msg" class="msg"></p>
    </form>
  </main>

  <script src="js/header.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('signup-form');
      const msg = document.getElementById('signup-msg');

      document.querySelector('.pw-toggle').addEventListener('click', function () {
        const t = this.dataset.target;
        const el = document.getElementById(t);
        if (el.type === 'password') { el.type = 'text'; this.textContent = 'Hide'; }
        else { el.type = 'password'; this.textContent = 'Show'; }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          // profile defaults
          photo: '', height: '', weight: '', age: '', gender: '', goal: '', activity: '', favorites: [], history: []
        };
        const res = auth.signup(user);
        if (res.success) { location.href = 'pages/dashboard.html'; }
        else { msg.textContent = res.msg; }
      });
    });
  </script>
</body>
</html>
